# Single source of truth for the cluster topology.
# Read by BOTH the Vagrantfile (Ruby) and the Salt pillar (jinja import_yaml),
# so node IPs / sizing are never duplicated.
cluster:
  name: hpc-lab
  box: bento/ubuntu-24.04
  nodes:
    builder:
      ip: 192.168.56.10
      cpus: 2
      memory: 4096
    controller:
      ip: 192.168.56.11
      cpus: 2
      memory: 2560
    compute:
      ip: 192.168.56.12
      cpus: 2
      memory: 6144
      # Advertised to Slurm as RealMemory (MB). Keep below the VM memory so
      # slurmd never reports less than the configured value.
      slurm_real_memory: 4096
